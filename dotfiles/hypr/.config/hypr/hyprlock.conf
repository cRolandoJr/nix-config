# hyprlock.conf — Deep Ocean lockscreen

$font = JetBrainsMono Nerd Font, MesloLGS NF, Noto Sans, Monospace

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    animation = fadeIn,          1, 2, easeOutQuint
    animation = fadeOut,         1, 1, easeOutQuint
    animation = inputFieldDots,  1, 2, easeOutQuint
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
    color = rgba(10, 14, 23, 0.45)
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    font_family = $font
    font_size = 28
    color = rgba(0, 180, 216, 0.75)
    position = 0, 240
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_family = $font
    font_size = 120
    color = rgba(205, 214, 244, 0.98)
    position = 0, 40
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    font_family = $font
    font_size = 14
    color = rgba(122, 139, 168, 0.80)
    position = 0, -60
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    inner_color = rgba(0, 0, 0, 0.50)
    outer_color = rgba(00b4d8ee) rgba(3b82f6ee) 45deg
    check_color = rgba(34d399ee) rgba(00b4d8ee) 120deg
    fail_color  = rgba(f87171ee) rgba(fb923cee) 40deg
    font_family = $font
    font_color = rgb(240, 240, 245)
    rounding = 18
    fade_on_empty = true
    dots_spacing = 0.35
    placeholder_text = Type to unlock…
    fail_text = $PAMFAIL
    position = 0, -140
    halign = center
    valign = center
}

label {
    monitor =
    text = $LAYOUT
    font_family = $font
    font_size = 11
    color = rgba(122, 139, 168, 0.70)
    position = 0, -210
    halign = center
    valign = center
}
